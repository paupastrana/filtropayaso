<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filtro Facial Interactivo RA</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #container {
      position: relative;
      width: 640px;
      height: 480px;
      max-width: 100vw;
      max-height: 80vh;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-radius: 12px;
      overflow: hidden;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* Efecto espejo */
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="container">
    <div id="status">Cargando modelo de rostro...</div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <!-- Usamos type="module" para importar correctamente MediaPipe -->
  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs";

    let faceLandmarker;
    let runningMode = "VIDEO";
    const video = document.getElementById("webcam");
    const canvasElement = document.getElementById("output_canvas");
    const canvasCtx = canvasElement.getContext("2d");
    const statusDiv = document.getElementById("status");

    let particles = [];

    async function initFaceLandmarker() {
      try {
        const filesetResolver = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
        );
        faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
          baseOptions: {
            modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
            delegate: "GPU"
          },
          outputFaceBlendshapes: true,
          runningMode: runningMode,
          numFaces: 1
        });
        statusDiv.innerText = "Cámara lista. Muestra tu rostro";
        startCamera();
      } catch (error) {
        console.error("Error al inicializar MediaPipe:", error);
        statusDiv.innerText = "Error al cargar el modelo";
      }
    }

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
        .then((stream) => {
          video.srcObject = stream;
          video.addEventListener("loadeddata", predictWebcam);
        })
        .catch((err) => {
          console.error("Error al acceder a la cámara:", err);
          statusDiv.innerText = "Permiso de cámara denegado o no disponible";
        });
    }

    async function predictWebcam() {
      canvasElement.width = video.videoWidth;
      canvasElement.height = video.videoHeight;

      let startTimeMs = performance.now();
      if (faceLandmarker) {
        const results = faceLandmarker.detectForVideo(video, startTimeMs);

        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        if (results.faceLandmarks && results.faceLandmarks.length > 0) {
          const landmarks = results.faceLandmarks[0];
          
          // Distancia entre labios para detectar si abre la boca
          const topLip = landmarks[13];
          const bottomLip = landmarks[14];
          const mouthDistance = Math.hypot(topLip.x - bottomLip.x, topLip.y - bottomLip.y);
          
          const isMouthOpen = mouthDistance > 0.05;

          drawCustomMask(landmarks, isMouthOpen);

          if (isMouthOpen) {
            createMouthParticles(landmarks[13].x * canvasElement.width, landmarks[13].y * canvasElement.height);
          }
        }
      }

      updateAndDrawParticles();
      window.requestAnimationFrame(predictWebcam);
    }
    function drawCustomMask(landmarks, isMouthOpen) {
      const w = canvasElement.width;
      const h = canvasElement.height;

      // Puntos clave de MediaPipe
      const noseTip = landmarks[1];         // Punta de la nariz
      const leftCheek = landmarks[234];     // Cachete izquierdo
      const rightCheek = landmarks[454];   // Cachete derecho
      const leftEye = landmarks[159];       // Arriba ojo izquierdo
      const rightEye = landmarks[386];      // Arriba ojo derecho
      const leftEyeBottom = landmarks[145]; // Abajo ojo izquierdo
      const rightEyeBottom = landmarks[374];// Abajo ojo tercero/derecho

      // Color reactivo al gesto (abrir la boca)
      const blushColor = isMouthOpen ? "#FF4081" : "#FF8A80";

      // 1. CHAPITAS MÁS CHIQUITAS Y DELICADAS
      canvasCtx.fillStyle = blushColor + "99"; // Semitransparente
      canvasCtx.beginPath();
      canvasCtx.arc(leftCheek.x * w + 10, leftCheek.y * h, 12, 0, Math.PI * 2);
      canvasCtx.arc(rightCheek.x * w - 10, rightCheek.y * h, 12, 0, Math.PI * 2);
      canvasCtx.fill();

      // 2. NARIZ DE PAYASITO BRILLANTE
      const noseRadius = isMouthOpen ? 18 : 15; // Crece un poco al abrir la boca
      canvasCtx.fillStyle = "#FF1744";
      canvasCtx.beginPath();
      canvasCtx.arc(noseTip.x * w, noseTip.y * h, noseRadius, 0, Math.PI * 2);
      canvasCtx.fill();

      // Brillo blanco en la nariz
      canvasCtx.fillStyle = "#FFFFFF";
      canvasCtx.beginPath();
      canvasCtx.arc(noseTip.x * w - 4, noseTip.y * h - 4, noseRadius * 0.3, 0, Math.PI * 2);
      canvasCtx.fill();

      // 3. TRIÁNGULOS ARRIBA Y ABAJO DE LOS OJOS
      // Triángulos superiores (apuntando hacia arriba)
      drawTriangle(leftEye.x * w, leftEye.y * h - 22, 12, 16, "up", "#00E5FF");
      drawTriangle(rightEye.x * w, rightEye.y * h - 22, 12, 16, "up", "#00E5FF");

      // Triángulos inferiores (invertidos, apuntando hacia abajo)
      drawTriangle(leftEyeBottom.x * w, leftEyeBottom.y * h + 18, 10, 14, "down", "#00E5FF");
      drawTriangle(rightEyeBottom.x * w, rightEyeBottom.y * h + 18, 10, 14, "down", "#00E5FF");

      // 4. SOMBRERITO DE PAYASO FLOTANTE
      const headTop = landmarks[10];
      drawClownHat(headTop.x * w, headTop.y * h - 40, isMouthOpen);
    }

    // Función auxiliar para dibujar triángulos hacia arriba o hacia abajo
    function drawTriangle(x, y, width, height, direction, color) {
      canvasCtx.fillStyle = color;
      canvasCtx.beginPath();
      if (direction === "up") {
        canvasCtx.moveTo(x, y - height); // Punta superior
        canvasCtx.lineTo(x - width / 2, y + height / 2); // Esquina izq
        canvasCtx.lineTo(x + width / 2, y + height / 2); // Esquina der
      } else {
        canvasCtx.moveTo(x, y + height); // Punta inferior (invertido)
        canvasCtx.lineTo(x - width / 2, y - height / 2); // Esquina izq
        canvasCtx.lineTo(x + width / 2, y - height / 2); // Esquina der
      }
      canvasCtx.closePath();
      canvasCtx.fill();
    }

    // Función auxiliar para dibujar el sombrerito
    function drawClownHat(x, y, isOpen) {
      canvasCtx.save();
      canvasCtx.translate(x, y);

      // Base del sombrero
      canvasCtx.fillStyle = isOpen ? "#FFD700" : "#AA00FF";
      canvasCtx.beginPath();
      canvasCtx.ellipse(0, 10, 35, 8, 0, 0, Math.PI * 2);
      canvasCtx.fill();

      // Copa del sombrero
      canvasCtx.beginPath();
      canvasCtx.moveTo(-20, 10);
      canvasCtx.lineTo(-12, -35);
      canvasCtx.lineTo(12, -35);
      canvasCtx.lineTo(20, 10);
      canvasCtx.closePath();
      canvasCtx.fill();

      // Pompón arriba del sombrero
      canvasCtx.fillStyle = "#FF4081";
      canvasCtx.beginPath();
      canvasCtx.arc(0, -40, 10, 0, Math.PI * 2);
      canvasCtx.fill();

      canvasCtx.restore();
    }


   

  
    function createMouthParticles(x, y) {
      for (let i = 0; i < 3; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 4,
          vy: Math.random() * -4 - 2,
          size: Math.random() * 6 + 4,
          color: `hsl(${Math.random() * 60 + 300}, 100%, 60%)`,
          alpha: 1
        });
      }
    }

    function updateAndDrawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        canvasCtx.save();
        canvasCtx.globalAlpha = p.alpha;
        canvasCtx.fillStyle = p.color;
        canvasCtx.beginPath();
        canvasCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        canvasCtx.fill();
        canvasCtx.restore();
      }
    }

    initFaceLandmarker();
  </script>
</body>
</html>
