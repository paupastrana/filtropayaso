<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filtro Facial Interactivo RA</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #container {
      position: relative;
      width: 640px;
      height: 480px;
      max-width: 100vw;
      max-height: 70vh;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Efecto espejo */
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 10;
    }

    #start-btn {
      margin-top: 15px;
      padding: 12px 24px;
      background-color: #FF4081;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
      z-index: 20;
    }

    #start-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div id="container">
    <div id="status">Esperando inicio...</div>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <button id="start-btn">¡Activar Cámara!</button>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs";

    let faceLandmarker;
    let runningMode = "VIDEO";
    const video = document.getElementById("webcam");
    const canvasElement = document.getElementById("output_canvas");
    const canvasCtx = canvasElement.getContext("2d");
    const statusDiv = document.getElementById("status");
    const startBtn = document.getElementById("start-btn");

    let particles = [];
    let audioCtx = null;
    let lastMouthState = false;

    async function initFaceLandmarker() {
      try {
        statusDiv.innerText = "Cargando modelo de rostro...";
        const filesetResolver = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
        );
        faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
          baseOptions: {
            modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
            delegate: "GPU"
          },
          outputFaceBlendshapes: true,
          runningMode: runningMode,
          numFaces: 1
        });
        statusDiv.innerText = "Listo para iniciar";
      } catch (error) {
        console.error("Error al inicializar MediaPipe:", error);
        statusDiv.innerText = "Error al cargar modelo";
      }
    }

    startBtn.addEventListener("click", async () => {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      startBtn.style.display = "none";
      statusDiv.innerText = "Solicitando cámara...";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } 
        });
        video.srcObject = stream;
        video.addEventListener("loadeddata", () => {
          statusDiv.innerText = "¡Filtro activo!";
          predictWebcam();
        });
      } catch (err) {
        console.error("Error al acceder a la cámara:", err);
        statusDiv.innerText = "Permiso de cámara denegado";
        startBtn.style.display = "block";
      }
    });

    async function predictWebcam() {
      if (video.videoWidth > 0 && video.videoHeight > 0) {
        canvasElement.width = video.videoWidth;
        canvasElement.height = video.videoHeight;
      }

      let startTimeMs = performance.now();
      if (faceLandmarker && video.readyState >= 2) {
        const results = faceLandmarker.detectForVideo(video, startTimeMs);

        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        if (results.faceLandmarks && results.faceLandmarks.length > 0) {
          const landmarks = results.faceLandmarks[0];
          
          const topLip = landmarks[13];
          const bottomLip = landmarks[14];
          const mouthDistance = Math.hypot(topLip.x - bottomLip.x, topLip.y - bottomLip.y);
          const isMouthOpen = mouthDistance > 0.05;

          if (isMouthOpen && !lastMouthState) {
            playClownSound();
            createMouthParticles(landmarks[13].x * canvasElement.width, landmarks[13].y * canvasElement.height);
          }
          lastMouthState = isMouthOpen;

          drawCustomMask(landmarks, isMouthOpen);

          if (isMouthOpen) {
            createMouthParticles(landmarks[13].x * canvasElement.width, landmarks[13].y * canvasElement.height);
          }
        }
      }

      updateAndDrawParticles();
      window.requestAnimationFrame(predictWebcam);
    }

    function drawCustomMask(landmarks, isMouthOpen) {
      const w = canvasElement.width;
      const h = canvasElement.height;

      // CALCULAR ESCALA DINÁMICA BASADA EN EL ANCHO DE LA CARA
      const leftCheek = landmarks[234];
      const rightCheek = landmarks[454];
      const faceWidth = Math.hypot((rightCheek.x - leftCheek.x) * w, (rightCheek.y - leftCheek.y) * h);
      
      // Factor de escala proporcional (tomando como base un ancho de referencia de 250 píxeles)
      const scale = faceWidth / 250;

      const noseTip = landmarks[1];
      const leftEye = landmarks[159];
      const rightEye = landmarks[386];
      const leftEyeBottom = landmarks[145];
      const rightEyeBottom = landmarks[374];

      // 1. NARIZ DE PAYASITO ESCALADA
      const noseRadius = (isMouthOpen ? 24 : 20) * scale;
      canvasCtx.fillStyle = "#FF1744";
      canvasCtx.beginPath();
      canvasCtx.arc(noseTip.x * w, noseTip.y * h, noseRadius, 0, Math.PI * 2);
      canvasCtx.fill();

      // Brillo blanco en la nariz
      canvasCtx.fillStyle = "#FFFFFF";
      canvasCtx.beginPath();
      canvasCtx.arc(noseTip.x * w - (4 * scale), noseTip.y * h - (4 * scale), noseRadius * 0.3, 0, Math.PI * 2);
      canvasCtx.fill();

      // 2. TRIÁNGULOS ESCALADOS AUTOMÁTICAMENTE
      const triWidth = 35 * scale;
      const triHeight = 40 * scale;

      drawTriangle(leftEye.x * w, leftEye.y * h - (35 * scale), triWidth, triHeight, "up", "#00E5FF");
      drawTriangle(rightEye.x * w, rightEye.y * h - (35 * scale), triWidth, triHeight, "up", "#00E5FF");

      drawTriangle(leftEyeBottom.x * w, leftEyeBottom.y * h + (35 * scale), triWidth, triHeight, "down", "#FFD700");
      drawTriangle(rightEyeBottom.x * w, rightEyeBottom.y * h + (35 * scale), triWidth, triHeight, "down", "#FFD700");

      // 3. SOMBRERITO DE PAYASO ESCALADO
      const headTop = landmarks[10];
      drawClownHat(headTop.x * w, headTop.y * h - (30 * scale), isMouthOpen, scale);
    }

    function drawTriangle(x, y, width, height, direction, color) {
      canvasCtx.fillStyle = color;
      canvasCtx.beginPath();
      if (direction === "up") {
        canvasCtx.moveTo(x, y - height / 2);
        canvasCtx.lineTo(x - width / 2, y + height / 2);
        canvasCtx.lineTo(x + width / 2, y + height / 2);
      } else {
        canvasCtx.moveTo(x, y + height / 2);
        canvasCtx.lineTo(x - width / 2, y - height / 2);
        canvasCtx.lineTo(x + width / 2, y - height / 2);
      }
      canvasCtx.closePath();
      canvasCtx.fill();
    }

    function drawClownHat(x, y, isOpen, scale) {
      canvasCtx.save();
      canvasCtx.translate(x, y);
      canvasCtx.scale(scale, scale); // Escalar todo el sombrero proporcionalmente

      canvasCtx.fillStyle = isOpen ? "#FFD700" : "#AA00FF";
      canvasCtx.beginPath();
      canvasCtx.ellipse(0, 10, 35, 8, 0, 0, Math.PI * 2);
      canvasCtx.fill();

      canvasCtx.beginPath();
      canvasCtx.moveTo(-20, 10);
      canvasCtx.lineTo(-12, -35);
      canvasCtx.lineTo(12, -35);
      canvasCtx.lineTo(20, 10);
      canvasCtx.closePath();
      canvasCtx.fill();

      canvasCtx.fillStyle = "#FF4081";
      canvasCtx.beginPath();
      canvasCtx.arc(0, -40, 10, 0, Math.PI * 2);
      canvasCtx.fill();
      canvasCtx.restore();
    }

    function playClownSound() {
      if (!audioCtx) return;
      try {
        [0, 0.12].forEach(delay => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, audioCtx.currentTime + delay);
          osc.frequency.linearRampToValueAtTime(350, audioCtx.currentTime + delay + 0.08);

          gain.gain.setValueAtTime(0.2, audioCtx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + delay + 0.08);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(audioCtx.currentTime + delay);
          osc.stop(audioCtx.currentTime + delay + 0.08);
        });
      } catch (e) {
        console.log("Audio bloqueado", e);
      }
    }

    function createMouthParticles(x, y) {
      for (let i = 0; i < 3; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 4,
          vy: Math.random() * -4 - 2,
          size: Math.random() * 6 + 4,
          color: `hsl(${Math.random() * 60 + 300}, 100%, 60%)`,
          alpha: 1
        });
      }
    }

    function updateAndDrawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        canvasCtx.save();
        canvasCtx.globalAlpha = p.alpha;
        canvasCtx.fillStyle = p.color;
        canvasCtx.beginPath();
        canvasCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        canvasCtx.fill();
        canvasCtx.restore();
      }
    }

    initFaceLandmarker();
  </script>
</body>
</html>
